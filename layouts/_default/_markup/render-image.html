{{- /* Body images: resolved through rel-src.html so posts work under subpath
     deployments, whether the path is written "images/x.png" or "/images/x.png"
     (relURL alone drops the subpath on the latter). */ -}}
<img src="{{ partial "rel-src.html" .Destination }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
