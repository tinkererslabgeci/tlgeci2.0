baseURL = "https://example.com/"
enableRobotsTXT = true
title = "Tinkerers’ Lab"
theme = "hugo-theme-popular"
# A bare `hugo server` here cannot find the theme (it lives at the repo root,
# not in themes/). Serve everything with scripts/serve-all.sh, or run:
#   hugo server --source <this dir> --themesDir <repo parent> --theme hugo-theme-popular

# Events use real future dates; without this Hugo treats a future date as the
# publish date and silently drops upcoming events from the build.
buildFuture = true

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  name = "Introduction"
  url = "/start/"
  weight = 5
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 10
[[menu.main]]
  name = "About us"
  parent = "About"
  url = "/about/"
  weight = 10
[[menu.main]]
  name = "Team"
  parent = "About"
  url = "/organizers/"
  weight = 20
# [[menu.main]]
#   name = "Blog"
#   url = "/blog/"
#   weight = 20
[[menu.main]]
  name = "Events"
  url = "/events/"
  weight = 30
# [[menu.main]]
#   name = "Talks"
#   url = "/talks/"
#   weight = 35
[[menu.main]]
  name = "Handbook"
  url = "/handbook/"
  weight = 50

[params]
  tagline = "24×7 student-run lak at GEC Idukki"
  description = "24×7 student-run lab for the tinkerers"
  brandName = "Tinkerers’ Lab"
  brandSub = "GECI"
  logo = "images/logo.png"
  ogImage = "images/hero.mp4"
  landAcknowledgement = "2nd Floor, Administrative Block\nGovt. Engineering College Idukki\n685603 – Painavu\nIdukki, Kerala"

  [params.brand]
    # Re-brand the whole site here, see /docs/theming/ on the theme site.
    primary       = "#6375a5"
    surfaceWash   = "#98c355"
    # fontDisplay   = "Quantico, Inter, sans-serif"

  [params.cta]
    label = "Book a Slot"
    url   = "https://example.com/rsvp"
    icon  = "fa-solid fa-calendar"

  # The community lives in chat between events. Set this and a "Join the chat"
  # button appears in the home hero and footer, and in the no-events empty
  # state. Platform-agnostic: Discord, Slack, Matrix, Zulip all fit.
  [params.community.chat]
    url   = "https://example.com/chat"
    label = "Join the chat"

  # Turn on the "Your name here?" invite card at the end of the speakers list,
  # pointing to /speak/. Off by default.
  [params.speakers]
    invite = false


  [[params.social]]
    label = "Instagram"
    icon  = "fa-brands fa-instagram"
    url   = "https://example.com"
  [[params.social]]
    label = "Mastodon"
    icon  = "fa-brands fa-mastodon"
    url   = "https://example.com"
  [[params.social]]
    label = "RSS"
    icon  = "fa-solid fa-rss"
    url   = "/blog/index.xml"
  [[params.social]]
    label = "Email"
    icon  = "fa-solid fa-envelope"
    url   = "mailto:hello@example.com"

  [params.footer]
    tagline = "Prototype. Break. Improve. Repeat."
    [params.footer.credit]
      label = "Maintained by the Outreach Team"
      url   = "https://popular.mariatta.ca/"
    [[params.footer.columns]]
      title = "Community"
      [[params.footer.columns.links]]
        label = "About us"
        url = "/about/"
      # [[params.footer.columns.links]]
      #   label = "Blog"
      #   url = "/blog/"
      [[params.footer.columns.links]]
        label = "Code of Conduct"
        url = "/code-of-conduct/"
    [[params.footer.columns]]
      title = "Get involved"
      [[params.footer.columns.links]]
        label = "Host a session"
        url = "/get-involved/"
      [[params.footer.columns.links]]
        label = "Offer a venue"
        url = "/get-involved/"
      [[params.footer.columns.links]]
        label = "Organizers"
        url = "/organizers/"
      [[params.footer.columns.links]]
        label = "Sponsors"
        url = "/sponsors/"
    [[params.footer.columns]]
      title = "Organizers"
      [[params.footer.columns.links]]
        label = "Organizer Handbook"
        url = "/handbook/"
      [[params.footer.columns.links]]
        label = "Meetup Runbooks"
        url = "/runbooks/"

[mediaTypes."text/calendar"]
  suffixes = ["ics"]

[outputFormats.Calendar]
  mediaType = "text/calendar"
  baseName = "calendar"
  isPlainText = true
  noUgly = true

[outputs]
  home = ["HTML", "RSS", "LLMS"]
